<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dhanvantari · Shop Ayurveda</title>
  <link rel="icon" href="/img/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .welcome {
      border-radius: 18px; padding: 26px 28px; color: #fff; margin-bottom: 22px; display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap;
      background: radial-gradient(600px 300px at 90% 120%, #d48a26 0%, transparent 55%), linear-gradient(120deg, var(--forest), #24624a);
    }
    .welcome h1 { color: #fff; margin: 0 0 4px; font-size: 28px; }
    .welcome p { margin: 0; color: #cfe0d3; }
    .welcome .near { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; max-width: 420px; }
    .welcome .near b { display: block; }
    .welcome .near small { color: #cfe0d3; }
    .loc-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 280px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 500 14px var(--font); color: var(--ink); }
    .loc-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cart-btn { position: relative; }
    .cart-btn .pip { position: absolute; top: -6px; right: -6px; background: var(--saffron); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; border: 2px solid var(--bg); }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar .input-icon { flex: 1; min-width: 220px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; }
    .chip { height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font: 500 13px var(--font); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--forest); border-color: var(--forest); color: #fff; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .product { display: flex; flex-direction: column; overflow: hidden; transition: transform .15s, box-shadow .15s; }
    .product:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .art { height: 150px; display: grid; place-items: center; position: relative; cursor: pointer; }
    .art svg { width: 84px; height: 84px; }
    .art .badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
    .product .pb { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
    .product .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
    .product h4 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 4px 0 2px; }
    .product .pack { font-size: 13px; color: var(--ink-2); }
    .product .desc { font-size: 13px; color: var(--ink-2); margin: 8px 0 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .price { font-weight: 700; font-size: 17px; }
    .mrp { font-size: 13px; color: var(--ink-3); text-decoration: line-through; margin-left: 6px; font-weight: 400; }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: 36px; }
    .qty button { width: 34px; height: 100%; border: 0; background: var(--sage-soft); color: var(--forest); cursor: pointer; display: grid; place-items: center; }
    .qty span { min-width: 30px; text-align: center; font-weight: 700; }
    .line { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .line .mini { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; flex: none; }
    .line .mini svg { width: 28px; height: 28px; }
    .sum { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-2); font-size: 14px; }
    .sum.total { color: var(--ink); font-weight: 700; font-size: 17px; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
    .section-t { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 22px 0 10px; }
    .pay-opts { display: grid; gap: 8px; }
    .pay-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
    .pay-opt input { accent-color: var(--forest); width: 18px; height: 18px; }
    .pay-opt:has(input:checked) { border-color: var(--leaf); background: #f3f8f3; }
    .pay-opt .pi { width: 36px; height: 36px; border-radius: 10px; background: var(--sage-soft); color: var(--forest); display: grid; place-items: center; }
    .pay-opt b { display: block; font-size: 14px; }
    .pay-opt small { font-size: 12px; }
    .addr-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
    .clinic-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .clinic-card { padding: 18px; }
    .clinic-card .ch { display: flex; gap: 12px; align-items: flex-start; }
    .clinic-card .ci { width: 44px; height: 44px; border-radius: 12px; background: var(--forest); color: #fff; display: grid; place-items: center; flex: none; }
    .order-card { padding: 18px 20px; cursor: pointer; transition: box-shadow .15s; }
    .order-card:hover { box-shadow: var(--shadow-lg); }
    .order-card + .order-card { margin-top: 12px; }
    .track { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
    .track .map { height: calc(100vh - 200px); min-height: 460px; }
    .rider-card { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 12px; background: var(--sky-soft); }
    .rider-card .avatar { background: var(--sky); color: #fff; width: 44px; height: 44px; }
    .eta { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--forest); line-height: 1; }
    .pick-map { height: 340px; border-radius: 12px; }
    .gateway { text-align: center; }
    .gateway .amt { font-family: var(--serif); font-size: 36px; font-weight: 600; margin: 6px 0 2px; }
    .gw-note { background: var(--saffron-soft); color: #7b4e10; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 14px 0; text-align: left; }
    @media (max-width: 960px) { .track { grid-template-columns: 1fr; } .track .map { height: 380px; min-height: 0; } }
    @media (max-width: 720px) { .loc-chip span { display: none; } }
  </style>
</head>
<body>
  <main class="page" id="app">
    <div class="empty"><div class="spin dark" style="margin:auto"></div></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/art.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
