<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dhanvantari · Authentic Ayurvedic Medicines</title>
  <meta name="description" content="Order authentic classical Ayurvedic medicines from verified clinics near you, with live delivery tracking." />
  <meta name="theme-color" content="#143a2b" />
  <link rel="icon" href="/img/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    /* ---------- Top bar extras ---------- */
    .loc-chip { display: inline-flex; align-items: center; gap: 8px; max-width: 260px; height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font: 500 13.5px var(--font); color: var(--ink); text-align: left; }
    .loc-chip:hover { border-color: var(--ink-3); }
    .loc-chip svg { color: var(--saffron); }
    .loc-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .loc-chip small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--ink-3); line-height: 1.1; }
    .cart-btn { position: relative; }
    .cart-btn .pip { position: absolute; top: -6px; right: -6px; background: var(--saffron); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; border: 2px solid #fff; }
    .cart-btn.bump { animation: bump .4s var(--ease); }
    @keyframes bump { 40% { transform: scale(1.15); } }

    /* ---------- Hero ---------- */
    .hero {
      position: relative; overflow: hidden; border-radius: 28px; color: #fff; padding: 48px 48px 44px;
      display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center;
      background: radial-gradient(700px 380px at 105% 120%, rgba(212,135,42,.55) 0%, transparent 60%),
                  radial-gradient(800px 500px at -10% -30%, #2d7553 0%, transparent 60%), var(--forest);
      box-shadow: var(--shadow-lg);
    }
    .hero .mandala { position: absolute; right: -120px; top: -140px; width: 520px; opacity: .09; pointer-events: none; }
    .hero h1 { color: #fff; font-size: 46px; line-height: 1.06; margin: 10px 0 14px; letter-spacing: -.02em; }
    .hero h1 em { color: #f3c47e; font-weight: 500; }
    .hero .lead { color: #cfe0d4; font-size: 16.5px; max-width: 520px; margin-bottom: 24px; }
    .hero .eyebrow { color: #f3c47e; }
    .searchbar { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 16px; padding: 6px 6px 6px 18px; max-width: 560px; box-shadow: 0 18px 40px -18px rgba(0,0,0,.5); }
    .searchbar svg { color: var(--ink-3); }
    .searchbar input { flex: 1; border: 0; outline: 0; font: 15px var(--font); color: var(--ink); height: 44px; min-width: 0; background: none; }
    .popular { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: #b7cdbd; align-items: center; }
    .popular button { border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #fff; border-radius: 99px; height: 30px; padding: 0 12px; font: 500 12.5px var(--font); cursor: pointer; }
    .popular button:hover { background: rgba(255,255,255,.16); }
    .deliver-card { position: relative; background: rgba(255,255,255,.98); color: var(--ink); border-radius: 20px; padding: 22px; box-shadow: 0 24px 50px -24px rgba(0,0,0,.6); }
    .deliver-card .dc-top { display: flex; gap: 14px; align-items: center; }
    .deliver-card .dc-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--forest); color: #fff; display: grid; place-items: center; flex: none; }
    .deliver-card .dc-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 18px 0; }
    .deliver-card .dc-stats div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .deliver-card .dc-stats b { display: block; font-family: var(--serif); font-size: 20px; }
    .deliver-card .dc-stats small { font-size: 11.5px; }
    .ticks { display: grid; gap: 8px; font-size: 13.5px; color: var(--ink-2); margin: 0; padding: 0; list-style: none; }
    .ticks li { display: flex; gap: 8px; align-items: center; }
    .ticks svg { color: var(--leaf); }

    /* ---------- Concern tiles ---------- */
    .concerns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .concern { border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; cursor: pointer; text-align: left; font-family: var(--font); background: var(--surface); transition: all .2s var(--ease); display: flex; flex-direction: column; gap: 12px; }
    .concern:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--c); }
    .concern.active { border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset; }
    .concern .ci { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--bgc); color: var(--c); }
    .concern .ci svg { width: 22px; height: 22px; }
    .concern b { font-size: 14.5px; color: var(--ink); display: block; }
    .concern small { font-size: 12.5px; }

    /* ---------- Product cards ---------- */
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
    .picks { display: grid; grid-auto-flow: column; grid-auto-columns: 250px; gap: 18px; overflow-x: auto; padding: 4px 2px 14px; scroll-snap-type: x mandatory; }
    .picks > * { scroll-snap-align: start; }
    .product { display: flex; flex-direction: column; overflow: hidden; border-radius: 20px; }
    .shot { aspect-ratio: 1 / .86; display: grid; place-items: center; position: relative; cursor: pointer; overflow: hidden; }
    .shot::after { content: ''; position: absolute; inset: auto 0 0; height: 40%; background: linear-gradient(transparent, rgba(255,255,255,.35)); pointer-events: none; }
    .shot svg { width: 78%; height: 92%; transition: transform .35s var(--ease); filter: drop-shadow(0 10px 14px rgba(0,0,0,.08)); }
    .product:hover .shot svg { transform: translateY(-4px) scale(1.03); }
    .shot .tl { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 1; }
    .shot .tr { position: absolute; top: 12px; right: 12px; z-index: 1; }
    .off { background: var(--clay); color: #fff; font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
    .product .pb { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; border-top: 1px solid var(--line); }
    .product .bot { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product h4 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 2px 0 4px; cursor: pointer; }
    .product h4:hover { color: var(--leaf); }
    .product .meta { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .price-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .price { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
    .mrp { font-size: 13px; color: var(--ink-3); text-decoration: line-through; margin-left: 6px; font-weight: 400; }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 11px; overflow: hidden; height: 38px; background: var(--surface); }
    .qty button { width: 36px; height: 100%; border: 0; background: var(--sage-soft); color: var(--forest); cursor: pointer; display: grid; place-items: center; }
    .qty button:hover { background: #d7e8da; }
    .qty span { min-width: 32px; text-align: center; font-weight: 700; }
    .qty.lg { height: 48px; } .qty.lg button { width: 46px; } .qty.lg span { min-width: 44px; font-size: 16px; }

    .toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; }
    .toolbar .sort { width: 210px; height: 40px; font-size: 14px; }
    .result-count { color: var(--ink-3); font-size: 13.5px; }

    .trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .trust > div { display: flex; gap: 14px; align-items: flex-start; padding: 20px; }
    .trust .ti { width: 44px; height: 44px; border-radius: 13px; background: var(--sage-soft); color: var(--forest); display: grid; place-items: center; flex: none; }
    .trust b { display: block; margin-bottom: 2px; }
    .trust small { font-size: 13px; }

    /* ---------- Product detail ---------- */
    .pd { display: grid; grid-template-columns: 1fr 1.1fr; }
    .pd-shot { display: grid; place-items: center; padding: 30px; position: relative; min-height: 420px; }
    .pd-shot svg { width: 88%; max-width: 360px; filter: drop-shadow(0 16px 22px rgba(0,0,0,.12)); }
    .pd-info { padding: 30px 32px; display: flex; flex-direction: column; }
    .pd-info h2 { font-size: 30px; margin: 6px 0 2px; }
    .pd-info .bot { font-family: var(--serif); font-style: italic; color: var(--ink-2); }
    .pd-price { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 4px; }
    .pd-price .price { font-size: 28px; }
    .benefits { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 10px; }
    .benefits li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
    .benefits li svg { width: 20px; height: 20px; padding: 3px; border-radius: 50%; background: var(--sage-soft); color: var(--leaf); flex: none; }
    .facts { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 4px; }
    .facts div { display: grid; grid-template-columns: 120px 1fr; gap: 12px; font-size: 14px; }
    .facts dt { color: var(--ink-3); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; padding-top: 1px; }
    .facts dd { margin: 0; }
    .pd-buy { display: flex; gap: 12px; margin-top: 22px; }
    .pd-close { position: absolute; top: 14px; left: 14px; }
    .note { font-size: 13px; border-radius: 12px; padding: 11px 14px; line-height: 1.45; }
    .note.rx { background: var(--plum-soft); color: var(--plum); }
    .note.warm { background: var(--saffron-soft); color: #7b4e10; }

    /* ---------- Cart ---------- */
    .line { display: flex; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .line .mini { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; flex: none; overflow: hidden; }
    .line .mini svg { width: 52px; height: 52px; }
    .sum { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-2); font-size: 14px; }
    .sum.total { color: var(--ink); font-weight: 700; font-size: 18px; border-top: 1px dashed var(--line-2); margin-top: 8px; padding-top: 12px; }
    .section-t { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin: 24px 0 10px; }
    .pay-opts { display: grid; gap: 8px; }
    .pay-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; transition: all .15s; }
    .pay-opt:hover { border-color: var(--line-2); }
    .pay-opt input { accent-color: var(--forest); width: 18px; height: 18px; }
    .pay-opt:has(input:checked) { border-color: var(--leaf); background: #f3f8f3; }
    .pay-opt .pi { width: 38px; height: 38px; border-radius: 11px; background: var(--sage-soft); color: var(--forest); display: grid; place-items: center; }
    .pay-opt b { display: block; font-size: 14px; }
    .pay-opt small { font-size: 12px; }
    .addr-box { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); }
    .progress { height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; margin-top: 6px; }
    .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--leaf), var(--leaf-2)); border-radius: 6px; transition: width .4s var(--ease); }

    /* ---------- Clinics ---------- */
    .clinic-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .clinic-card { padding: 20px; display: flex; flex-direction: column; }
    .clinic-card .ch { display: flex; gap: 14px; align-items: flex-start; }
    .clinic-card .ci { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(145deg, var(--forest-2), var(--forest)); color: #fff; display: grid; place-items: center; flex: none; }
    .services { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

    /* ---------- Orders ---------- */
    .order-card { padding: 18px 20px; cursor: pointer; display: flex; gap: 18px; align-items: center; }
    .order-card + .order-card { margin-top: 12px; }
    .thumbs { display: flex; flex: none; }
    .thumbs div { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; border: 3px solid #fff; overflow: hidden; }
    .thumbs div + div { margin-left: -18px; }
    .thumbs svg { width: 50px; height: 50px; }
    .track { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
    .track .map { height: calc(100vh - 210px); min-height: 480px; }
    .rider-card { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--sky-soft); }
    .rider-card .avatar { background: var(--sky); color: #fff; width: 46px; height: 46px; }
    .eta { font-family: var(--serif); font-size: 34px; font-weight: 600; color: var(--forest); line-height: 1; }
    .pick-map { height: 340px; border-radius: 14px; }
    .gateway { text-align: center; }
    .gateway .amt { font-family: var(--serif); font-size: 40px; font-weight: 600; margin: 6px 0 2px; }

    @media (max-width: 480px) {
      .topbar { gap: 8px; }
      .topbar .brand > div:last-child { display: none; }
      .loc-chip { flex: 1; max-width: none; min-width: 0; }
      .topbar .spacer { display: none; }
    }
    @media (max-width: 1100px) { .concerns { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } .trust { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 960px) {
      .hero { grid-template-columns: minmax(0, 1fr); padding: 32px 26px; }
      .hero > * { min-width: 0; }
      .hero h1 { font-size: 36px; }
      .track { grid-template-columns: 1fr; } .track .map { height: 380px; min-height: 0; }
      .pd { grid-template-columns: 1fr; } .pd-shot { min-height: 280px; padding: 20px; } .pd-shot svg { max-width: 240px; }
      .pd-info { padding: 22px; }
    }
    @media (max-width: 720px) {
      .loc-chip { max-width: 140px; padding: 0 10px; } .loc-chip small { display: none; }
      .hero { border-radius: 22px; padding: 26px 20px; }
      .hero h1 { font-size: 30px; }
      .deliver-card { padding: 18px; }
      .concerns { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; grid-template-columns: none; overflow-x: auto; padding-bottom: 8px; }
      .products { grid-template-columns: 1fr 1fr; gap: 12px; }
      .product .pb { padding: 12px; } .product h4 { font-size: 15.5px; } .price { font-size: 16px; }
      .product .meta .dosha { display: none; }
      .price-row { flex-direction: column; align-items: stretch; } .price-row .btn, .price-row .qty { width: 100%; } .price-row .qty { justify-content: space-between; }
      .shot .tr { top: auto; bottom: 10px; right: 10px; }
      .shot .tl { right: 10px; }
      .searchbar { padding-left: 14px; } .searchbar .btn { padding: 0 14px; }
      .deliver-card .dc-stats { gap: 6px; } .deliver-card .dc-stats div { padding: 8px; }
      .trust { grid-template-columns: 1fr; }
      .order-card { flex-direction: column; align-items: stretch; }
      .toolbar .sort { width: 100%; }
    }
  </style>
</head>

  <main class="page" id="app">
    <div class="skel" style="height:320px;border-radius:28px"></div>
    <div class="products" style="margin-top:28px">
      <div class="skel" style="height:360px;border-radius:20px"></div><div class="skel" style="height:360px;border-radius:20px"></div>
      <div class="skel" style="height:360px;border-radius:20px"></div><div class="skel" style="height:360px;border-radius:20px"></div>
    </div>
  </main>
  <footer class="site-footer" id="footer"></footer>
  <nav class="bottomnav" id="bottomnav"></nav>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/art.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
