<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dhanvantari · Delivery partner</title>
  <link rel="icon" href="/img/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { height: 100vh; display: flex; flex-direction: column; }
    .layout { flex: 1; display: grid; grid-template-columns: 420px 1fr; min-height: 0; }
    .side { overflow-y: auto; padding: 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
    .mapwrap { position: relative; }
    .mapwrap .map { position: absolute; inset: 0; border-radius: 0; min-height: 0; }
    .duty { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
    .duty .grow b { display: block; font-size: 16px; }
    .switch { position: relative; width: 56px; height: 32px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; background: #d5d0c2; border-radius: 99px; cursor: pointer; transition: .2s; }
    .switch span::before { content: ''; position: absolute; width: 24px; height: 24px; left: 4px; top: 4px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .switch input:checked + span { background: var(--leaf); }
    .switch input:checked + span::before { transform: translateX(24px); }
    .job { padding: 0; overflow: hidden; }
    .job-top { background: var(--forest); color: #fff; padding: 16px 18px; }
    .job-top small { color: #c8d8cc; }
    .stop { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .stop .sd { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }
    .stop.done { opacity: .5; }
    .req { padding: 14px 16px; }
    .req + .req { margin-top: 10px; }
    .req.fresh { animation: flash 1.6s ease-out 3; }
    @keyframes flash { 50% { box-shadow: 0 0 0 5px rgba(212,138,38,.4); } }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kpis .card { padding: 12px; text-align: center; }
    .kpis b { display: block; font-family: var(--serif); font-size: 22px; }
    .kpis small { font-size: 12px; }
    .gps { font-size: 12px; display: flex; gap: 6px; align-items: center; }
    .gps i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
    .gps.on i { background: var(--leaf); box-shadow: 0 0 0 4px rgba(47,122,87,.2); }
    @media (max-width: 900px) {
      body { height: auto; }
      .layout { grid-template-columns: 1fr; }
      .mapwrap { height: 360px; order: -1; }
      .side { border-right: 0; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side" id="side"><div class="empty"><div class="spin dark" style="margin:auto"></div></div></aside>
    <section class="mapwrap"><div class="map" id="map"></div></section>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/rider.js"></script>
</body>
</html>
