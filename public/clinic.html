<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dhanvantari · Clinic desk</title>
  <link rel="icon" href="/img/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
    .col { background: #efebdf; border-radius: 16px; padding: 12px; min-height: 360px; }
    .col-h { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 12px; font-weight: 700; font-size: 14px; }
    .col-h .n { background: #fff; border-radius: 99px; padding: 1px 9px; font-size: 12px; }
    .oc { padding: 14px; margin-bottom: 10px; cursor: pointer; }
    .oc.fresh { animation: flash 1.6s ease-out 2; border-color: var(--saffron); }
    @keyframes flash { 50% { box-shadow: 0 0 0 5px rgba(212,138,38,.35); } }
    .oc .items { font-size: 13px; color: var(--ink-2); margin: 6px 0 10px; }
    .oc .acts { display: flex; gap: 6px; margin-top: 10px; }
    .oc .acts .btn { flex: 1; }
    .rider-mini { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--sky); background: var(--sky-soft); border-radius: 8px; padding: 6px 8px; }
    @media (max-width: 1100px) { .board { grid-template-columns: repeat(4, 270px); } }
  </style>
</head>
<body>
  <main class="page" id="app"><div class="empty"><div class="spin dark" style="margin:auto"></div></div></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/orderview.js"></script>
  <script>
  (async function () {
    const { icons, api, esc, money, toast, fail, busy } = DV;
    const me = await DV.requireRole('clinic');
    const clinic = (await api('/clinics')).find((c) => c.id === me.clinicId);
    const bar = DV.topbar(me, { roleLabel: 'Clinic desk' });
    const socket = DV.connect(bar);
    const app = document.getElementById('app');
    let orders = await api('/orders');
    const fresh = new Set();

    const COLS = [
      ['placed', 'New orders', 'saffron'],
      ['accepted', 'Preparing', 'sky'],
      ['ready', 'Ready for pickup', 'saffron'],
      ['picked_up', 'Out for delivery', 'sky'],
    ];

    function render() {
      const today = orders.filter((o) => o.status === 'delivered' && DV.toDate(o.updatedAt).toDateString() === new Date().toDateString());
      app.innerHTML = `
        <div class="page-head"><div><h1>${esc(clinic?.name || 'Clinic')}</h1><p>${icons.pin} ${esc(clinic?.address || '')}</p></div>
          <div class="row"><span class="badge">${today.length} delivered today</span><span class="badge saffron">${money(today.reduce((s, o) => s + o.total, 0))} today</span></div></div>
        <div class="board">${COLS.map(([st, label]) => {
          const list = orders.filter((o) => o.status === st);
          return `<section class="col"><div class="col-h">${label}<span class="n">${list.length}</span></div>
            ${list.map(card).join('') || `<div class="empty" style="padding:30px 10px"><small>No orders</small></div>`}</section>`;
        }).join('')}</div>
        <div class="card" style="margin-top:22px"><div class="card-head"><h3>Recent completed & cancelled</h3></div>
          <div class="table-wrap"><table class="t"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Updated</th></tr></thead><tbody>
          ${orders.filter((o) => ['delivered', 'cancelled'].includes(o.status)).slice(0, 25).map((o) => `<tr class="click" data-o="${o.id}"><td><b>${esc(o.code)}</b></td><td>${esc(o.customer.name)}</td>
            <td>${o.items.reduce((s, i) => s + i.qty, 0)}</td><td>${money(o.total)}</td><td>${DV.payBadge(o)}</td><td>${DV.statusBadge(o.status)}</td><td><small>${DV.ago(o.updatedAt)}</small></td></tr>`).join('')
            || `<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">Nothing yet</td></tr>`}
          </tbody></table></div></div>`;

      app.querySelectorAll('[data-o]').forEach((el) => (el.onclick = (e) => { if (!e.target.closest('button')) openOrder(Number(el.dataset.o)); }));
      app.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => act(Number(b.dataset.id), b.dataset.act, b)));
    }

    function card(o) {
      const actions = {
        placed: `<button class="btn sm ghost" data-act="cancelled" data-id="${o.id}">Reject</button><button class="btn sm" data-act="accepted" data-id="${o.id}">${icons.check} Accept</button>`,
        accepted: `<button class="btn sm saffron" data-act="ready" data-id="${o.id}">${icons.box} Mark packed</button>`,
      }[o.status] || '';
      return `<article class="card oc ${fresh.has(o.id) ? 'fresh' : ''}" data-o="${o.id}">
        <div class="row" style="justify-content:space-between"><b>${esc(o.code)}</b><small>${DV.ago(o.createdAt)}</small></div>
        <div class="items">${o.items.map((i) => `${esc(i.name)} × ${i.qty}${i.rx ? ' <span class="badge rx">Rx</span>' : ''}`).join('<br>')}</div>
        <div class="row" style="justify-content:space-between"><b>${money(o.total)}</b>${DV.payBadge(o)}</div>
        <div style="margin-top:8px">${o.rider ? `<div class="rider-mini">${icons.bike}<span class="grow">${esc(o.rider.name)}</span>${o.status === 'picked_up' ? 'on the way' : 'assigned'}</div>`
          : `<small>${icons.bike} Waiting for rider…</small>`}</div>
        ${actions ? `<div class="acts">${actions}</div>` : ''}</article>`;
    }

    async function act(id, status, btn) {
      let note;
      if (status === 'cancelled') {
        note = prompt('Reason for rejecting this order (shared with the customer):', 'Item out of stock');
        if (note === null) return;
      }
      await busy(btn, async () => {
        try { upsert(await api(`/orders/${id}/status`, { method: 'POST', body: { status, note } })); render(); toast(status === 'accepted' ? 'Order accepted' : status === 'ready' ? 'Marked as packed' : 'Order rejected'); }
        catch (e) { fail(e); }
      });
    }

    function openOrder(id) {
      const o = orders.find((x) => x.id === id);
      const acts = {
        placed: `<button class="btn ghost" data-close>Close</button><button class="btn" id="ovAct" data-s="accepted">${icons.check} Accept order</button>`,
        accepted: `<button class="btn ghost" data-close>Close</button><button class="btn saffron" id="ovAct" data-s="ready">${icons.box} Mark packed</button>`,
      }[o.status];
      const md = OrderView.open(o, { actions: acts });
      md.querySelector('#ovAct')?.addEventListener('click', async (e) => { md.close(); await act(o.id, e.currentTarget.dataset.s, document.createElement('button')); });
    }

    const upsert = (o) => { const i = orders.findIndex((x) => x.id === o.id); i >= 0 ? (orders[i] = o) : orders.unshift(o); };

    socket.on('order:update', (o) => {
      const isNew = !orders.find((x) => x.id === o.id);
      upsert(o);
      if (isNew) { fresh.add(o.id); setTimeout(() => fresh.delete(o.id), 4000); }
      render();
      if (OrderView.openId === o.id) openOrder(o.id);
    });
    socket.on('rider:location', (p) => {
      const o = orders.find((x) => x.id === p.orderId);
      if (o) o.riderLocation = p;
      OrderView.moveRider(p);
    });
    window.addEventListener('dv:open-order', (e) => orders.find((o) => o.id === e.detail) && openOrder(e.detail));
    setInterval(render, 60000); // refresh relative times
    render();
  })();
  </script>
</body>
</html>
